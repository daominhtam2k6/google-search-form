<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Form Tìm kiếm</title>

</head>


<body>

    <h1>
        Form tìm kiếm Google
    </h1>


    <form
        action="https://www.google.com.vn/search"
        method="GET">

        <input
            type="text"
            name="q"
            placeholder="Nhập từ khóa">

        <input
            type="submit"
            value="Tìm kiếm">

    </form>


    <h2>
        Form tìm kiếm Bing
    </h2>


    <form
        action="https://www.bing.com/search"
        method="GET">

        <input
            type="text"
            name="q"
            placeholder="Nhập từ khóa">

        <input
            type="submit"
            value="Tìm kiếm trên Bing">

    </form>

</body>

</html>
